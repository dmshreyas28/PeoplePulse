version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: peoplepulse-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: peoplepulse
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: peoplepulse-backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/peoplepulse
      MODEL_PATH: /app/models/model.pkl
      MLFLOW_TRACKING_URI: http://mlflow:5000
      DEBUG: "True"
    ports:
      - "8000:8000"
    volumes:
      - ../backend/app:/app/app
      - ../ml/models:/app/models
      - ../ml/pipeline:/ml/pipeline
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # Frontend
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: peoplepulse-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

  # MLflow Tracking Server (Optional)
  mlflow:
    image: python:3.10-slim
    container_name: peoplepulse-mlflow
    working_dir: /mlflow
    command: >
      bash -c "pip install mlflow psycopg2-binary &&
               mlflow server 
               --backend-store-uri postgresql://postgres:postgres@db:5432/mlflow
               --default-artifact-root /mlflow/artifacts
               --host 0.0.0.0
               --port 5000"
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/mlflow
    depends_on:
      db:
        condition: service_healthy

  # PgAdmin (Optional - Database Management UI)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: peoplepulse-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@peoplepulse.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db

volumes:
  postgres_data:
  mlflow_data:

networks:
  default:
    name: peoplepulse-network
